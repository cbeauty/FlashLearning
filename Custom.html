<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Loader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #fileInput {
            display: none; /* Hide the default file input */
        }
        #fileList {
            width: 300px;
            height: 200px;
            border: 1px solid #ccc;
            overflow-y: auto;
            margin-top: 15px;
            padding: 5px;
        }
        .list-item {
            padding: 3px 0;
            border-bottom: 1px dotted #eee;
        }
    </style>
</head>
<body>
    <h1>Load Text File Contents</h1>
    <button id="loadFileButton">Load Text File</button>
    <input type="file" id="fileInput" accept=".txt">
    <div id="fileList"></div>

    <script src="script.js"></script>
</body>
</html>
