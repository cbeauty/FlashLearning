<div id="table-container"></div>
<div class="image-container">
    <!-- The main background image is set via CSS on the container -->
    <img src="https://cbeauty.github.io/FlashLearning/1-b1.svg" alt="Overlay Image" class="overlay-image" id="overlayImage">
    <button onclick="showOverlayImage()">Show Image</button>
</div>

<style>
image-container {
    position: relative; /* Crucial: sets the positioning context for absolute children */
    width: 600px;
    height: 400px;
    background-image: url('background_image.jpg'); /* The background image */
    background-size: cover;
    background-position: center;
}

.overlay-image {
    position: absolute; /* Positions this image relative to the container */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Centers the image perfectly */
    z-index: 2; /* Ensures the overlay image is on top */
    display: none; /* Initially hides the image */
    /* Add desired width/height for the overlay image */
    width: 100px;
    height: auto;
}

  .fixed-table {
    table-layout: fixed; /* Important for fixed column widths */
    width: 100%; /* Or a specific fixed width */
    height: 100%;
    border-collapse: collapse;
  }

  .fixed-table th,
  .fixed-table td {
    width: 20%; /* Fixed cell width (adjust as needed) */
    height: 20%; /* Fixed row height (adjust as needed) */
    overflow: hidden; /* Hide overflowing content */
    text-overflow: ellipsis; /* Add ellipsis for hidden text */
    white-space: wrap; /* Prevent text wrapping */
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

</style>
<script>

function showOverlayImage() {
    var overlay = document.getElementById("overlayImage");
    overlay.style.display = "block"; // Change from 'none' to 'block' to show the image
}

  function createFixedTable(containerId, rows, cols) {
    const container = document.getElementById(containerId);
    if (!container) {
      console.error("Container element not found.");
      return;
    }


let  linesArray = new Array();
// Using Fetch API (modern approach)
fetch('https://cbeauty.github.io/FlashLearning/answers.txt')
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    return response.text();
  })
  .then(fileContent => {
    linesArray = fileContent.split('\n');
    console.log(linesArray);
  })
  .catch(error => {
    console.error('Error fetching file:', error);
  });

    const table = document.createElement('table');
    table.classList.add('fixed-table'); // Apply the CSS class

    // Create table header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    for (let i = 0; i < cols; i++) {
      const th = document.createElement('th');
      th.textContent = `Header ${i + 1}`;
      headerRow.appendChild(th);
    }
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Create table body
    const tbody = document.createElement('tbody');
    for (let i = 0; i < rows; i++) {
      const row = document.createElement('tr');
      for (let j = 0; j < cols; j++) {
        const cell = document.createElement('td');
        const celcontent = linesArray[(i + 1)* (j + 1)];
        cell.textContent = celcontent;
        row.appendChild(cell);
      }
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }

  // Call the function to create the table
  document.addEventListener('DOMContentLoaded', () => {
    createFixedTable('table-container', 5, 5); // 5 rows, 3 columns
  });
</script>
