<div id="table-container"></div>

<style>
  .fixed-table {
    table-layout: fixed; /* Important for fixed column widths */
    width: 100%; /* Or a specific fixed width */
    height: 100%;
    border-collapse: collapse;
  }

  .fixed-table th,
  .fixed-table td {
    width: 20%; /* Fixed cell width (adjust as needed) */
    height: 20%; /* Fixed row height (adjust as needed) */
    overflow: hidden; /* Hide overflowing content */
    text-overflow: ellipsis; /* Add ellipsis for hidden text */
    white-space: wrap; /* Prevent text wrapping */
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

</style>
<script>


  function createFixedTable(containerId, rows, cols) {
    const container = document.getElementById(containerId);
    if (!container) {
      console.error("Container element not found.");
      return;
    }


const  linesArray = new Array();
// Using Fetch API (modern approach)
fetch('https://cbeauty.github.io/FlashLearning/answers.txt')
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    return response.text();
  })
  .then(fileContent => {
    linesArray = fileContent.split('\n');
    console.log(linesArray);
  })
  .catch(error => {
    console.error('Error fetching file:', error);
  });

    const table = document.createElement('table');
    table.classList.add('fixed-table'); // Apply the CSS class

    // Create table header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    for (let i = 0; i < cols; i++) {
      const th = document.createElement('th');
      th.textContent = `Header ${i + 1}`;
      headerRow.appendChild(th);
    }
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Create table body
    const tbody = document.createElement('tbody');
    for (let i = 0; i < rows; i++) {
      const row = document.createElement('tr');
      for (let j = 0; j < cols; j++) {
        const cell = document.createElement('td');
        cell.textContent = linesArray[(i + 1)* (j + 1)];
        row.appendChild(cell);
      }
      tbody.appendChild(row);
    }
    table.appendChild(tbody);

    container.appendChild(table);
  }

  // Call the function to create the table
  document.addEventListener('DOMContentLoaded', () => {
    createFixedTable('table-container', 5, 5); // 5 rows, 3 columns
  });
</script>
