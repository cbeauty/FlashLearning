<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMASHING</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensures the body takes at least the full viewport height */
            margin: 0;
            background-color: #f0f0f0; /* Optional: for better visual contrast */
        }
        table {
            border-collapse: collapse;
            border: none;
        }
        td {
            border: none;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        .select-wrapper {
            position: relative;
            display: inline-block;
            min-width: 200px;
         }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="functions.js"></script>
       
    <Script>

    let subjects = [];
    let GCorrectanswers = 0;
    let GCompletionTime = 0;

    document.addEventListener('DOMContentLoaded', () => {

        const queryString = window.location.search; // Example: "?name=John&age=30"
        const params = new URLSearchParams(queryString);

        if( params.has('time')){
        GCompletionTime = params.get('time');
        }
        if( params.has('correctanswers')){
        GCorrectanswers = params.get('correctanswers');
        }

        if(GCompletionTime > 0){

            let congratsCell = document.getElementById('congrats');
            congratsCell.textContent = "Congratulations";
            congratsCell.style.fontSize = "36px";


            let scoreCell = document.getElementById('score');
            scoreCell.textContent = "Your correctly answered " + GCorrectanswers + " in " + GCompletionTime + " seconds."
        }

        loadTextFile('https://cbeauty.github.io/FlashLearning/subjects.txt').then(dataArray => {
        if (dataArray.length > 0) {
        
        
             subjects = dataArray;

             const mySelect = document.getElementById('TestOptions');
       
            let i = 0;
            subjects.forEach(item => {
            const option = document.createElement('option');
            option.value = subjects[i];
            option.textContent = subjects[i]
            mySelect.className = "select-wrapper"
            mySelect.appendChild(option);

            i++;
            });


        } else {
            document.getElementById('item-list').textContent = 'No data found or error loading questions file.';
        }


        });

    });


    function handleSubmit(event) {
    event.preventDefault(); // Prevent default form submission

  
    
    // Get form elements
    const chosensubject = document.getElementById('TestOptions');
    const selectedIndex = chosensubject.selectedIndex;
    const selectedOption = chosensubject.options[selectedIndex];


    let rows=3;
    let cols=3;
    let RadioLevelmedium = document.getElementById('medium');
    // To access the first radio button in the group:
    if(RadioLevelmedium.checked){
        rows=4;
        cols=4;
    }    
    var RadioLevelhard = document.getElementById('hard');
    // To access the first radio button in the group:
    if(RadioLevelhard.checked){
        rows=5;
        cols=5;
    }
    // Get values
    const subject = selectedOption.value;

    // Construct URL with parameters
    const newPageUrl = 'indexfl.html?subject='+encodeURIComponent(subject)+'&rows='+encodeURIComponent(rows)+'&cols='+encodeURIComponent(rows);

    // Redirect to the new page
    window.location.href = newPageUrl;

    return false; // Prevent further submission
}
    </Script>
</head>
<body>
    <form  onsubmit="return handleSubmit(event);">
            <table>
            <tr>
                <td id="congrats">&nbsp;</td>
            </tr>
            <tr>
                <td id="score">&nbsp;</td>
            </tr>
            <tr>
                <td>&nbsp;</td>
            </tr>
            <tr>
                <td style="font-size: 36px; color: red;">Flash Learning</td>
            </tr>
            <tr>
                <td><i>Learning through play</i></td>
            </tr>
            <tr>
                <td>Choose your revision topic:</td>
            </tr>
            <tr>
                <td>
                    <select id="TestOptions">
                    
                    </select>
                </td>
            </tr>

            <tr><td>
            <fieldset id="levels">
                <legend>Select your difficulty level:</legend>

                <div>
                    <input type="radio" id="easy" name="fav_color" value=3 checked=true >
                    <label for="red">Easy&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                </div>

                <div>
                    <input type="radio" id="medium" name="fav_color" value=4>
                    <label for="blue">Medium</label>
                </div>

                <div>
                    <input type="radio" id="hard" name="fav_color" value=5>
                    <label for="green">Hard&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                </div>
                
            
            </fieldset>
            </td></tr>
            <tr><td>
                <div>
                    <button type="submit">Start Game</button>
                </div>
            </td></tr>
        </table>
    </form>

</body>
<script>

    var myElement = document.body;
    var hammertime = new Hammer(myElement);

    hammertime.on('swipeleft', function(ev) {
        console.log('Swiped left!', ev);
        document.location.href = "https://cbeauty.github.io/FlashLearning/menu.html";
    });

    hammertime.on('swiperight', function(ev) {
        console.log('Swiped right!', ev);
        document.location.href = "https://cbeauty.github.io/FlashLearning/menu.html";
    });


    function toggleFade() {
    if (isFadingIn) {
        newDiv.classList.remove('fade-out');
        newDiv.classList.add('fade-in');
    } else {
        newDiv.classList.remove('fade-in');
        newDiv.classList.add('fade-out');
    }

    isFadingIn = !isFadingIn;
    }


    

    newDiv= document.createElement('div');
    newDiv.id = 'dynamicLayer';
    newDiv.className = 'fadingDiv';
    newDiv.style.color = "#bbbbbb";

    

    document.body.appendChild(newDiv); // Appending to the body
    newDiv.innerHTML = '<h2>&lt;&nbsp;&nbsp;&nbsp;Swipe Me!&nbsp;&nbsp;&nbsp;&gt;</h2>';
            // Set position to absolute
    newDiv.style.position = 'absolute';

    // Set new top and left values
    newDiv.style.left = "44%";
    newDiv.style.top = '80%';
  
 
    let isFadingIn = true;



    // Initial fade-in
    newDiv.classList.add('fade-in');

    // Set interval to toggle fade every few seconds
    setInterval(toggleFade, 2000); // Adjust the duration (in milliseconds) as needed



</script>
</html>
